name: Construir imagen Docker

on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, "app/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vladalan/mya-faceswap

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # La imagen CUDA pesa ~10 GB: liberar espacio del runner
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:3.9.1-cuda
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Vladalan/mya-faceswap
            org.opencontainers.image.description=FaceFusion CUDA + interfaz MYA para ZimaOS
